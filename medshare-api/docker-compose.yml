# Banco de desenvolvimento.
#
# A senha aqui é local e descartável: o banco só escuta em localhost e nunca
# sai desta máquina. Em produção tudo vem de variável de ambiente (.env).
#
# Se a porta 5432 já estiver ocupada por um Postgres instalado na máquina,
# NÃO mexa aqui: ponha no .env desta pasta
#
#     MEDSHARE_BANCO_PORTA=5433
#     MEDSHARE_BANCO_URL=jdbc:postgresql://localhost:5433/medshare
#
# O Docker Compose lê o .env da pasta dele sozinho, e a API também. Assim cada
# máquina resolve o conflito dela sem alterar arquivo versionado — e ninguém
# precisa desinstalar nem parar o Postgres que já usa.
services:
  banco:
    image: postgis/postgis:16-3.4
    container_name: medshare-banco
    environment:
      POSTGRES_DB: medshare
      POSTGRES_USER: medshare
      POSTGRES_PASSWORD: medshare_local
    ports:
      - "${MEDSHARE_BANCO_PORTA:-5432}:5432"
    volumes:
      - dados-medshare:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medshare -d medshare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-medshare:
