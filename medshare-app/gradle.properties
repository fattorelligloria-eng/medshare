org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Compila o Kotlin dentro do próprio processo do Gradle em vez de abrir um
# daemon separado. Em máquina com pouca memória, dois daemons competindo é o
# que derruba o build.
kotlin.compiler.execution.strategy=in-process
