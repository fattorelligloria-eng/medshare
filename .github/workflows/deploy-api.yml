# Publica a API no Cloud Run a cada push na main que mexa nela.
#
# Só a imagem muda aqui. Variáveis, segredos, banco e pasta de fotos ficam na
# configuração do serviço no Cloud Run, e o deploy preserva tudo isso.
#
# Não precisa de secret: a identidade vem do Workload Identity Federation.

name: deploy da api

on:
  push:
    branches: [main]
    paths:
      - 'medshare-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Em deploy não se cancela: o Cloud Run fica sempre com o último que terminou.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGIAO: southamerica-east1
  IMAGEM: southamerica-east1-docker.pkg.dev/medshare-5005/medshare/api:${{ github.sha }}

jobs:
  deploy:
    name: deploy da api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # A migração do Flyway roda quando a API sobe: teste quebrado não pode
      # chegar ao banco de produção.
      - name: Rodar os testes
        working-directory: medshare-api
        run: ./gradlew test --no-daemon

      - name: Entrar no Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/991665634659/locations/global/workloadIdentityPools/github/providers/medshare
          service_account: github-deploy@medshare-5005.iam.gserviceaccount.com

      - name: Instalar o gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Construir e enviar a imagem
        working-directory: medshare-api
        run: |
          gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet
          docker build -t "$IMAGEM" .
          docker push "$IMAGEM"

      - name: Publicar no Cloud Run
        run: gcloud run deploy medshare-api --image "$IMAGEM" --region "$REGIAO" --project medshare-5005 --quiet
