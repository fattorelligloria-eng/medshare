# Publica o painel no Firebase Hosting.
#
# - Pull request para a main: sobe uma prévia num canal temporário (expira em
#   7 dias) e comenta o link no PR, para revisar a tela antes de juntar.
# - Push na main (PR aprovado e juntado): publica no site de verdade.
#
# Não precisa de secret: o GitHub se identifica no Google por Workload Identity
# Federation, e só este repositório pode assumir a conta de serviço.
# O painel chama /api no próprio domínio; o firebase.json leva isso ao Cloud Run.

name: firebase hosting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Dois pushes seguidos no mesmo PR: o deploy antigo é cancelado, só o último vale.
concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS: firebase-tools@13.35.1

jobs:
  deploy:
    name: deploy do painel
    runs-on: ubuntu-latest
    # PR vindo de fork não recebe a identidade; sem ela o deploy só falharia.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: medshare-painel/package-lock.json

      - name: Entrar no Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/991665634659/locations/global/workloadIdentityPools/github/providers/medshare
          service_account: github-deploy@medshare-5005.iam.gserviceaccount.com

      # O predeploy do firebase.json instala e compila o painel.
      - name: Prévia do PR
        id: previa
        if: github.event_name == 'pull_request'
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project medshare-5005 --expires 7d --json > previa.json
          node -e "const r=require('./previa.json');const u=Object.values(r.result)[0].url;require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'url='+u+'\n')"

      - name: Comentar o link no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL_DA_PREVIA: ${{ steps.previa.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Prévia do painel (expira em 7 dias): ${process.env.URL_DA_PREVIA}`,
            })

      - name: Publicar no site
        if: github.event_name == 'push'
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project medshare-5005 --non-interactive
